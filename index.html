<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한글사냥꾼</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>

<div class="screen" id="start-screen">
  <img class="bg" src="asset/image/Background_step1.png" alt="배경">

  <div class="monster-wrap monster-wrap--tl">
    <img class="monster" src="asset/image/ms_yg_fly.png" alt="야광귀">
  </div>
  <div class="monster-wrap monster-wrap--bl">
    <img class="monster" src="asset/image/ms_gs_fly.png" alt="그슨대">
  </div>
  <div class="monster-wrap monster-wrap--tr">
    <img class="monster" src="asset/image/ms_bs_fly.png" alt="불가살이">
  </div>
  <div class="monster-wrap monster-wrap--br">
    <img class="monster" src="asset/image/ms_dk_fly.png" alt="도깨비">
  </div>

  <img class="logo-typo" src="asset/image/logo_typo.png" alt="한글사냥꾼">

  <button class="start-button" id="start-button" type="button">
    <img src="asset/image/button_gamestart.png" alt="게임 시작">
  </button>
</div>

<div class="screen" id="character-screen" hidden>
  <img class="bg" src="asset/image/Background_step1.png" alt="배경">

  <img class="logo-typo logo-typo--small" src="asset/image/logo_typo.png" alt="한글사냥꾼">

  <div class="char-card" id="char-boy" data-character="boy">
    <img class="char-card__img" src="asset/image/cr_boy_box.png" alt="남자 사냥꾼">
  </div>
  <div class="char-card" id="char-girl" data-character="girl">
    <img class="char-card__img" src="asset/image/cr_girl_box.png" alt="여자 사냥꾼">
  </div>
</div>

<div class="screen" id="map-screen" data-back-target="start-screen" hidden>
  <img class="bg" src="asset/image/Background_step3.png" alt="배경">

  <div class="firefly-layer" id="firefly-layer"></div>

  <button class="back-button" type="button">
    <img src="asset/image/button_back.png" alt="뒤로가기">
  </button>

  <div class="stage-track" id="stage-track"></div>

  <img class="map-character" id="map-character" alt="캐릭터" hidden>
</div>

<div class="screen" id="game1-rule-screen" data-back-target="map-screen" hidden>
  <img class="bg" src="asset/image/Background_step4.png" alt="배경">

  <button class="back-button" type="button">
    <img src="asset/image/button_back.png" alt="뒤로가기">
  </button>

  <img class="rule-mission" src="asset/image/mission_game1.png" alt="미션 설명">

  <img class="rule-talk" src="asset/image/talk_yg.png" alt="야광귀 대사">

  <img class="rule-character" src="asset/image/ms_yg_basic.png" alt="야광귀">

  <button class="rule-challenge-button" id="game1-challenge-button" type="button">
    <img src="asset/image/button_dojun.png" alt="도전">
  </button>
</div>

<div class="screen" id="game2-rule-screen" data-back-target="map-screen" hidden>
  <img class="bg" src="asset/image/Background_step5.png" alt="배경">

  <button class="back-button" type="button">
    <img src="asset/image/button_back.png" alt="뒤로가기">
  </button>

  <img class="rule-mission" src="asset/image/mission_game2.png" alt="미션 설명">

  <div class="gs-rule-char-wrap">
    <img class="gs-rule-character" src="asset/image/ms_gs_basic.png" alt="그슨대">
    <img class="gs-rule-talk" src="asset/image/talk_gs.png" alt="그슨대 대사">
  </div>

  <button class="rule-challenge-button" id="game2-challenge-button" type="button">
    <img src="asset/image/button_dojun.png" alt="도전">
  </button>
</div>

<div class="screen" id="game3-rule-screen" data-back-target="map-screen" hidden>
  <img class="bg" src="asset/image/Background_step6.png" alt="배경">

  <button class="back-button" type="button">
    <img src="asset/image/button_back.png" alt="뒤로가기">
  </button>

  <img class="rule-mission" src="asset/image/mission_game3.png" alt="미션 설명">

  <div class="bs-rule-char-wrap">
    <img class="bs-rule-character" src="asset/image/ms_bs_basic.png" alt="불가살이">
    <img class="bs-rule-talk" src="asset/image/talk_bs.png" alt="불가살이 대사">
  </div>

  <button class="rule-challenge-button" id="game3-challenge-button" type="button">
    <img src="asset/image/button_dojun.png" alt="도전">
  </button>
</div>

<div class="screen" id="game3-play-screen" data-back-target="map-screen" hidden>
  <img class="bg" src="asset/image/Background_step6.png" alt="배경">

  <button class="back-button" type="button">
    <img src="asset/image/button_back.png" alt="뒤로가기">
  </button>

  <img class="game3-mission" src="asset/image/mission_game3_main.png" alt="불을 피해 쇠를 3개 모아줘! 쇠를 좋아하는 불가살이를 위해 쇠로 만들어진 단어를 모아주세요.">

  <div class="game3-count" id="game3-count">
    <span class="game3-count__label">남은 수량</span>
    <span class="game3-count__value" id="game3-count-value">0/3</span>
  </div>

  <div class="game3-drop-layer" id="game3-drop-layer"></div>

  <img class="game3-character" id="game3-character" src="asset/image/ms_bs_game_happy.png" alt="불가살이">
</div>

<div class="screen" id="game2-play-screen" data-back-target="map-screen" hidden>
  <img class="bg" src="asset/image/Background_step5_bright.png" alt="배경(밝음)">

  <img class="bg game2-dark-overlay" id="game2-dark-overlay" src="asset/image/Background_step5.png" alt="배경(어둠)">

  <div class="game2-hidden-layer" id="game2-hidden-layer"></div>

  <button class="back-button" type="button">
    <img src="asset/image/button_back.png" alt="뒤로가기">
  </button>

  <img class="game2-mission" id="game2-mission" src="asset/image/mission_game2_main.png" alt="숨은 그슨대를 찾아줘! 손전등을 비춰 유사한 물체들 사이 숨은 그슨대를 찾아주세요.">

  <img class="game2-mission-find" id="game2-mission-find" src="asset/image/mission_game2_find.png" alt="찾았다!">
</div>

<div class="screen" id="game1-play-screen" data-back-target="map-screen" hidden>
  <img class="bg" src="asset/image/Background_step4.png" alt="배경">

  <button class="back-button" type="button">
    <img src="asset/image/button_back.png" alt="뒤로가기">
  </button>

  <img class="game1-mission" src="asset/image/mission_game1_main.png" alt="'짚신' 글씨를 만들어줘 - 순서대로 클릭해 야광귀에게 짚신을 전달해요">

  <div class="wordbox-row" id="wordbox-row">
    <img class="wordbox" id="wordbox-1" src="asset/image/game1_wordbox1_off.png" alt="빈칸 1">
    <img class="wordbox" id="wordbox-2" src="asset/image/game1_wordbox2_off.png" alt="빈칸 2">
    <img class="wordbox" id="wordbox-3" src="asset/image/game1_wordbox3_off.png" alt="빈칸 3">
    <img class="wordbox" id="wordbox-4" src="asset/image/game1_wordbox4_off.png" alt="빈칸 4">
    <img class="wordbox" id="wordbox-5" src="asset/image/game1_wordbox5_off.png" alt="빈칸 5">
    <img class="wordbox" id="wordbox-6" src="asset/image/game1_wordbox6_off.png" alt="빈칸 6">
  </div>

  <img class="jamo-piece jamo-1" data-order="1" data-letter="ㅈ" src="asset/image/game1_word1.png" alt="자모 ㅈ">
  <img class="jamo-piece jamo-2" data-order="2" data-letter="ㅣ" src="asset/image/game1_word2.png" alt="자모 ㅣ">
  <img class="jamo-piece jamo-3" data-order="3" data-letter="ㅍ" src="asset/image/game1_word3.png" alt="자모 ㅍ">
  <img class="jamo-piece jamo-4" data-order="4" data-letter="ㅅ" src="asset/image/game1_word4.png" alt="자모 ㅅ">
  <img class="jamo-piece jamo-5" data-order="5" data-letter="ㅣ" src="asset/image/game1_word5.png" alt="자모 ㅣ">
  <img class="jamo-piece jamo-6" data-order="6" data-letter="ㄴ" src="asset/image/game1_word6.png" alt="자모 ㄴ">

  <img class="rule-character" id="game1-character" src="asset/image/ms_yg_basic.png" alt="야광귀">
</div>

<div class="screen" id="yagwanggwi-story1-screen" hidden>
  <img class="bg" src="asset/image/Background_step4.png" alt="배경">

  <div class="story-converge-row" id="story-converge-row">
    <img class="story-converge-box" src="asset/image/game1_wordbox1_on.png" alt="">
    <img class="story-converge-box" src="asset/image/game1_wordbox2_on.png" alt="">
    <img class="story-converge-box" src="asset/image/game1_wordbox3_on.png" alt="">
    <img class="story-converge-box" src="asset/image/game1_wordbox4_on.png" alt="">
    <img class="story-converge-box" src="asset/image/game1_wordbox5_on.png" alt="">
    <img class="story-converge-box" src="asset/image/game1_wordbox6_on.png" alt="">
  </div>

  <img class="story1-zipsin" src="asset/image/zipsin.png" alt="짚신">

  <img class="story-talk1" src="asset/image/ygstory_talk1.png" alt="'짚신' 완성!">
</div>

<div class="screen" id="yagwanggwi-story2-screen" hidden>
  <img class="bg" src="asset/image/Background_step4.png" alt="배경">

  <img class="story2-zipsin" src="asset/image/zipsin.png" alt="짚신">

  <div class="yg-story-char-wrap" id="yg-story-char-wrap">
    <img class="story2-character" src="asset/image/ms_yg_basic.png" alt="야광귀">
    <img class="story2-talk" src="asset/image/talk_yg_story.png" alt="고마워! '아래아'를 돌려줄게">
  </div>
</div>

<div class="screen" id="yagwanggwi-story3-screen" hidden>
  <img class="bg" src="asset/image/Background_step4.png" alt="배경">

  <img class="story3-title" src="asset/image/ygstory_talk2.png" alt="'아래아' 카드를 획득했다">

  <div class="story3-card" id="story3-card">
    <div class="story3-card__inner" id="story3-card-inner">
      <img class="story3-card__face story3-card__face--front" src="asset/image/card_1_front.png" alt="아래아 카드 앞면">
      <img class="story3-card__face story3-card__face--back" src="asset/image/card_1_back.png" alt="아래아 카드 뒷면">
    </div>
  </div>

  <button class="story3-next-button" id="story3-next-button" type="button">
    <img src="asset/image/button_next.png" alt="다음">
  </button>
</div>

<div class="screen" id="game2-story1-screen" hidden>
  <img class="bg" src="asset/image/Background_step5.png" alt="배경">

  <div class="game2-story1-char-wrap" id="game2-story1-char-wrap">
    <img class="game2-story1-character" src="asset/image/game2_hidgs_4.png" alt="그슨대">
    <img class="game2-story1-talk" src="asset/image/talk_gs_story.png" alt="약속대로 '반시옷'을 돌려줄게">
  </div>
</div>

<div class="screen" id="game2-story2-screen" hidden>
  <img class="bg" src="asset/image/Background_step5.png" alt="배경">

  <img class="story3-title" src="asset/image/gsstory_talk2.png" alt="'반시옷' 카드를 획득했다">

  <div class="story3-card" id="game2-story-card">
    <div class="story3-card__inner" id="game2-story-card-inner">
      <img class="story3-card__face story3-card__face--front" src="asset/image/card_2_front.png" alt="반시옷 카드 앞면">
      <img class="story3-card__face story3-card__face--back" src="asset/image/card_2_back.png" alt="반시옷 카드 뒷면">
    </div>
  </div>

  <button class="story3-next-button" id="game2-story-next-button" type="button">
    <img src="asset/image/button_next.png" alt="다음">
  </button>
</div>

<script src="shared/main.js"></script>
</body>
</html>
